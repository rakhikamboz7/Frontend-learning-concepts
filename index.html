<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive dashboard layout built with semantic HTML and Flexbox.">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
 
  <!-- Backdrop overlay for mobile nav -->
  <div class="overlay" id="overlay" aria-hidden="true"></div>
 
  <!-- Mobile slide-in nav drawer (from LEFT) -->
  <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;">
      <span style="font-weight:800;font-size:1.1rem;letter-spacing:-0.3px;">Menu</span>
      <button class="mobile-nav__close" id="mobileNavClose" aria-label="Close menu">&#x2715;</button>
    </div>
    <ul class="mobile-nav__list">
      <li><a href="#" class="mobile-nav__link">Home</a></li>
      <li><a href="#" class="mobile-nav__link">Profile</a></li>
      <li><a href="#" class="mobile-nav__link">Logout</a></li>
    </ul>
  </nav>
 
  <header class="site-header">
    <div class="site-header__left">
      <h1 class="site-header__title">Dashboard</h1>
    </div>
 
    <!-- Desktop nav — hidden on mobile -->
    <nav class="site-nav" aria-label="Main navigation">
      <ul class="site-nav__list">
        <li><a href="#" class="site-nav__link">Home</a></li>
        <li><a href="#" class="site-nav__link">Profile</a></li>
        <li><a href="#" class="site-nav__link">Logout</a></li>
      </ul>
    </nav>
 
    <!-- Hamburger — only visible on mobile, sits on the right -->
    <button class="hamburger" id="hamburger" aria-label="Open navigation menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>
 
  <div class="dashboard">
    <aside class="dashboard__sidebar collapsed" id="sidebar" aria-label="Sidebar menu">
 
      <!-- Toggle arrow button -->
      <button class="sidebar-toggle" id="sidebarToggle" aria-expanded="false" aria-controls="sidebarNav" aria-label="Expand sidebar">
        <span class="sidebar-toggle__arrow">&#8250;</span>
      </button>
 
      <nav id="sidebarNav" aria-label="Sidebar navigation">
        <ul class="sidebar-nav__list">
          <li><a href="#" class="sidebar-nav__link">Menu 1</a></li>
          <li><a href="#" class="sidebar-nav__link">Menu 2</a></li>
          <li><a href="#" class="sidebar-nav__link">Menu 3</a></li>
        </ul>
      </nav>
    </aside>
 
    <main class="dashboard__main">
      <section class="stats-section" aria-labelledby="stats-heading">
        <h2 id="stats-heading" class="section-title">Overview</h2>
        <div class="stats-grid">
          <article class="stat-card">
            <h3 class="stat-card__title">Users</h3>
            <p class="stat-card__text">Track total active users.</p>
          </article>
          <article class="stat-card">
            <h3 class="stat-card__title">Orders</h3>
            <p class="stat-card__text">Monitor order activity.</p>
          </article>
          <article class="stat-card">
            <h3 class="stat-card__title">Revenue</h3>
            <p class="stat-card__text">Review current revenue insights.</p>
          </article>
        </div>
      </section>
 
      <section class="data-section" aria-labelledby="data-heading">
        <h2 id="data-heading" class="section-title">Data Loader</h2>
        <div class="data-section__inner">
          <button type="button" class="action-button" id="loadBtn" aria-label="Load data">Load Data</button>
          <div id="data" class="data-output" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"/>
</body>

</html>
